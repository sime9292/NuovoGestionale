m-ui`;ctx.fillText(s?name:p,0,0);ctx.restore()}}ctx.strokeStyle='rgba(255,255,255,.20)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();ctx.fillStyle=pinch?'#ffbf69':'#86d0ff';ctx.beginPath();ctx.arc(px,py,Math.max(8,rad*.07),0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.stroke()};\nonResults=function(res){if(canvas.width!==video.videoWidth||canvas.height!==video.videoHeight){canvas.width=video.videoWidth||960;canvas.height=video.videoHeight||540}ctx.clearRect(0,0,canvas.width,canvas.height);if(!res.multiHandLandmarks?.length){if(pinch||voice){stopVoice(.14);pinch=false;locked=null;bend=0}stateEl.textContent='ATTESA';bendEl.textContent='Bend: 0 cent';statusEl.textContent='Nessuna mano rilevata.';return}const lm=res.multiHandLandmarks[0];drawConnectors(ctx,lm,HAND_CONNECTIONS,{color:'#61afff',lineWidth:3});drawLandmarks(ctx,lm,{color:'#fff',lineWidth:1,radius:2.5});const p5={x:lm[5].x*canvas.width,y:lm[5].y*canvas.height},p17={x:lm[17].x*canvas.width,y:lm[17].y*canvas.height},p0={x:lm[0].x*canvas.width,y:lm[0].y*canvas.height},p9={x:lm[9].x*canvas.width,y:lm[9].y*canvas.height},t4={x:lm[4].x*canvas.width,y:lm[4].y*canvas.height},t8={x:lm[8].x*canvas.width,y:lm[8].y*canvas.height};palm=(dist(p5,p17)+dist(p0,p9))/2;v3IndexLen=dist(p5,t8);const ax=p9.x-p0.x,ay=p9.y-p0.y,alen=Math.max(1,Math.hypot(ax,ay));v3Ux=ax/alen;v3Uy=ay/alen;v3Vx=-v3Uy;v3Vy=v3Ux;v3Angle=Math.atan2(v3Uy,v3Ux);cx=lerp(cx||p5.x,p5.x,.42);cy=lerp(cy||p5.y,p5.y,.42);rad=lerp(rad,clamp(v3IndexLen*.95,70,Math.min(canvas.width,canvas.height)*.23),.38);px=t8.x;py=t8.y;const dx=px-cx,dy=py-cy,forward=dx*v3Ux+dy*v3Uy,side=dx*v3Vx+dy*v3Vy,dg=clamp(Math.atan2(side,forward)/D2R,V3_A0,V3_A1);selF=(dg-V3_A0)/V3_SPAN*24;const target=Math.round(selF);if(target===v3Stable)v3StableFrames++;else{v3Stable=target;v3StableFrames=1}if(v3StableFrames>=3&&Math.abs(selF-sel)>.62)sel=v3Stable;const selMidi=range().low+sel;noteEl.textContent=mName(pinch&&locked!=null?locked:selMidi);if(!pinch){stateEl.textContent='PRONTA';bendEl.textContent='Bend: 0 cent';statusEl.textContent=`Selezionata ${mName(selMidi)} \u00b7 chiudi pollice e indice per suonare`}const pinchNorm=dist(t4,t8)/Math.max(30,v3IndexLen),now=performance.now(),dt=prevTs?now-prevTs:16;let next=pinch;if(!pinch&&pinchNorm<V3_CLOSE)next=true;else if(pinch&&pinchNorm>V3_OPEN)next=false;if(!pinch&&next){const vel=prevNorm==null?.72:clamp(.38+Math.max(0,(prevNorm-pinchNorm)/Math.max(1,dt))*11,.35,1);startNote(selMidi,vel);const pm={x:(t4.x+t8.x)/2,y:(t4.y+t8.y)/2};v3BendReach=dist(pm,p0)/Math.max(30,palm);bend=0;voice&&voice.setPitch(0);stateEl.textContent='SUONA';statusEl.textContent=`Nota ON \u00b7 ${mName(selMidi)} \u00b7 volume ${Math.round(vel*100)}%`}if(pinch&&!next){stopVoice(.18);locked=null;bend=0;stateEl.textContent='PRONTA';bendEl.textContent='Bend: 0 cent';statusEl.textContent='Nota OFF \u00b7 rilascio tipo assolo'}pinch=next;prevNorm=pinchNorm;prevTs=now;if(pinch&&voice){const sens=Number(sensEl.value),pm={x:(t4.x+t8.x)/2,y:(t4.y+t8.y)/2},reach=dist(pm,p0)/Math.max(30,palm),delta=reach-v3BendReach,dead=.012/sens,used=Math.abs(delta)>dead?(Math.abs(delta)-dead)*Math.sign(delta):0,full=.16/sens,targetB=clamp((used/full)*MAXB,-MAXB,MAXB);bend=lerp(bend,targetB,.50);voice.setPitch(bend);const cents=Math.round(bend*100);bendEl.textContent=`Bend: ${cents>0?'+':''}${cents} cent`;statusEl.textContent=`Nota ON \u00b7 ${mName(locked)} \u00b7 bend ${cents>0?'+':''}${cents} cent`}drawRose(selMidi)};\nhands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.68,minTrackingConfidence:.72});hands.onResults(onResults);\ncam=async function(){stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:960},height:{ideal:540},frameRate:{ideal:30,min:24}}});video.srcObject=stream;await video.play();running=true;loop()};\n$('legend').textContent='Rosa ancorata alla nocca dell\u2019indice \u00b7 punta dell\u2019indice = selezione \u00b7 pinch chiuso = nota ON \u00b7 allontana il pinch dal polso per alzare il bend, avvicinalo per abbassarlo.';\ninfoEl.textContent='Scegli con la punta dell\u2019indice, poi chiudi il pinch';\n</script>\n";h=h.replace('</body>',patch+'</body>');document.open();document.write(h);document.close()}).catch(e=>{document.getElementById('msg').innerHTML='<span class=err>'+e.message+'</span>'})</script></body></html>
